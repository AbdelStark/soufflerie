[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "soufflerie"
version = "0.1.0"
description = "A reproducible wind-tunnel workflow for numerical and learned flow models."
authors = [{ name = "AbdelStark" }]
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.2.6",
  "pandas==2.3.3",
  "pyarrow==23.0.1",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "PyYAML==6.0.3",
  "safetensors==0.8.0",
  "scipy==1.17.1",
  "typer==0.27.2",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Typing :: Typed",
]
keywords = ["computational-fluid-dynamics", "machine-learning", "wind-tunnel"]

[project.urls]
Homepage = "https://github.com/AbdelStark/soufflerie"
Repository = "https://github.com/AbdelStark/soufflerie.git"
Issues = "https://github.com/AbdelStark/soufflerie/issues"

[project.optional-dependencies]
solver = ["warp-lang==1.17.0"]
ml = [
  "nvidia-physicsnemo[cu12]==2.2.1",
  "tensorboard==2.21.0",
  "torch==2.10.0",
]
remote = ["modal==1.5.5"]
serve = [
  "fastapi==0.141.1",
  "gradio==6.26.0",
  "httpx==0.28.1",
]
viz = [
  "imageio==2.37.4",
  "matplotlib==3.11.1",
  "pillow==12.3.0",
]

[dependency-groups]
dev = [
  "hypothesis==6.167.1",
  "mypy==2.3.1",
  "pre-commit==4.6.2",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.5",
]
release = [
  "build==1.6.0",
  "cyclonedx-bom==7.3.1",
  "pip-audit==2.10.1",
  "uv==0.12.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/soufflerie"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "soufflerie/configs"
"schemas/v1" = "soufflerie/schemas/v1"

[tool.hatch.build.targets.sdist]
include = [
  "/docs",
  "/configs",
  "/schemas",
  "/scripts",
  "/src",
  "/tests",
  "/SPEC.md",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.uv]
default-groups = ["dev"]
