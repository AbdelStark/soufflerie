name: CPU CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_NO_PROGRESS: "1"

jobs:
  lint-type:
    name: Lint, types, schemas, and docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install pinned uv with lock-keyed cache
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.8"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync the locked development environment
        run: uv sync --frozen
      - name: Verify lock freshness
        run: uv lock --check
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Check strict typing
        run: uv run mypy src tests
      - name: Validate generated schemas
        run: |
          uv run python scripts/validate_schemas.py
          uv run python scripts/generate_bundled_model.py --check
      - name: Validate documentation and governance
        run: |
          uv run python scripts/check_docs.py
          uv run python scripts/check_governance.py
      - name: Self-test CI policy
        run: uv run python scripts/check_ci_policy.py

  unit-contract:
    name: CPU unit and contract coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install pinned uv with lock-keyed cache
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.8"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync the locked development environment
        run: uv sync --frozen --extra solver
      - name: Run CPU-safe coverage gate without network
        env:
          UV_OFFLINE: "1"
        run: >-
          uv run pytest -m "not remote"
          --cov=src/soufflerie
          --cov-report=term-missing
          --cov-fail-under=90

  integration:
    name: CPU integration and distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install pinned uv with lock-keyed cache
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.8"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync the locked development environment
        run: uv sync --frozen --extra solver
      - name: Run bounded CPU integration tests without network
        env:
          UV_OFFLINE: "1"
        run: uv run pytest -m "integration and not remote"
      - name: Build distributions from locked source
        env:
          UV_OFFLINE: "1"
        run: uv build
      - name: Enforce distribution contents and metadata
        run: uv run python scripts/check_distribution.py dist/*
