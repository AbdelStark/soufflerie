minimum_pre_commit_version: "4.6.2"
default_language_version:
  python: python3.11

repos:
  - repo: local
    hooks:
      - id: lock-check
        name: locked dependencies are current
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format-check
        name: Ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: strict-mypy
        name: strict Mypy
        entry: uv run mypy src tests
        language: system
        pass_filenames: false
        always_run: true
      - id: schema-contracts
        name: generated schema contracts
        entry: uv run python scripts/validate_schemas.py
        language: system
        pass_filenames: false
        always_run: true
      - id: docs-contracts
        name: documentation links and claims
        entry: uv run python scripts/check_docs.py
        language: system
        pass_filenames: false
        always_run: true
      - id: governance-contracts
        name: governance contracts
        entry: uv run python scripts/check_governance.py
        language: system
        pass_filenames: false
        always_run: true
      - id: ci-policy
        name: CI trust-boundary policy
        entry: uv run python scripts/check_ci_policy.py
        language: system
        pass_filenames: false
        always_run: true

  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
